name: Windows build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check frontend
        run: pnpm check

      - name: Build Windows installer
        shell: bash
        run: pnpm tauri build --no-sign --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: hoshi-reader-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
